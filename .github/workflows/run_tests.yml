name: Unit tests

on:
  workflow_dispatch:
jobs:
  testing:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup java 17
      uses: actions/setup-java@v5
      with:
        # Temurin publishes no JDK 17 build for Windows arm64, so that leg uses
        # the Microsoft Build of OpenJDK, which ships a native Windows aarch64 JDK 17.
        distribution: ${{ (runner.os == 'Windows' && runner.arch == 'ARM64' && 
          matrix.java == 17) && 'microsoft' || 'temurin' }}
        java-version: '${{ matrix.java }}'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The legacy 'tools' package is not available from sdkmanager on every host
        # (e.g. Linux arm64). Only install cmdline-tools and accept licenses; the
        # Android Gradle Plugin downloads the required platform/build-tools itself.
        packages: ''
        log-accepted-android-sdk-licenses: false
    - name: Enable x86_64 emulation for aapt2 on Linux arm64
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support libc6-amd64-cross libstdc++6-amd64-cross
        sudo mkdir -p /lib64
        sudo ln -sf /usr/x86_64-linux-gnu/lib64/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2 || sudo ln -sf /usr/x86_64-linux-gnu/lib/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2 || true
        echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"
    - name: Execute tests
      run: |
        ./gradlew test
    name: testing [${{ matrix.expander_leg }}]
    timeout-minutes: 150
